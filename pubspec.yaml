name: cafeteria_escom
description: "Aplicación de pedidos en línea para la cafetería de la ESCOM - IPN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  google_sign_in: ^6.3.0

  # ── Base de datos local ───────────────────────────────────
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Gestión de estado ─────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navegación ────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Inyección de dependencias ─────────────────────────────
  get_it: ^8.0.3

  # ── Programación funcional ────────────────────────────────
  dartz: ^0.10.1
  equatable: ^2.0.7

  # ── UI / Animaciones ──────────────────────────────────────
  lottie: ^3.3.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # ── Formularios ───────────────────────────────────────────
  reactive_forms: ^17.0.1

  # ── Dispositivo / Sensores ────────────────────────────────
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4

  # ── Utilidades ────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0

  # ── Íconos ────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

